<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenaitor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b1012">
<title>Mi entrenamiento · Entrenaitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1012; --card:#141b1e; --card2:#1b2427; --line:#26333a;
    --txt:#eef1f4; --mut:#8b979e; --acc:#058789; --acc-ink:#ffffff; --acc-txt:#3fc3c5;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(110px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0}
  h1{font-size:32px;line-height:1.05} h2{font-size:24px} h1,h2{font-style:italic;font-weight:800}
  .mut{color:var(--mut)} .small{font-size:13px}
  .brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
  .logo{font-family:"Barlow Condensed";font-weight:700;font-size:18px;letter-spacing:.08em}
  .logo b{color:var(--acc-txt)}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:12px;white-space:nowrap}
  .weeks{display:flex;gap:6px;overflow-x:auto;margin:16px 0 8px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 40px}
  .weeks::-webkit-scrollbar{display:none}
  .weeks button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 12px;font:600 14px Inter;cursor:pointer}
  .weeks button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
  .day{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
  .day .top{display:flex;justify-content:space-between;align-items:center}
  .status{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
  .s-done{background:#173322;color:var(--ok)} .s-prog{background:#33290f;color:var(--warn)} .s-pend{background:var(--card2);color:var(--mut)}
  .exlist{margin:8px 0 0;padding:0;list-style:none;color:var(--mut);font-size:13px;line-height:1.5}
  .todo{margin-top:10px;background:#0a2628;border-radius:10px;padding:8px 10px;font-size:13px;color:#a9e2e3}
  .back{background:none;border:0;color:var(--mut);font:500 14px Inter;padding:0;margin-bottom:10px;cursor:pointer}
  .bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--acc-txt);width:0;transition:width .3s}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
  .scale button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:8px;padding:8px 0;font:600 14px Inter;cursor:pointer}
  .scale button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
  .ex .num{font-family:"Barlow Condensed";font-weight:700;color:var(--acc-txt);font-size:20px;margin-right:6px}
  .ex h3{font-size:20px;line-height:1.15;display:flex}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
  .chips span{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--card2);color:#c3c9d1}
  .target{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut);margin-bottom:6px}
  .target b{color:var(--txt);font-weight:600}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--mut);font-weight:500;text-align:center;padding:4px 0}
  th:first-child{text-align:left}
  td{padding:4px 3px;text-align:center;vertical-align:middle}
  td:first-child{text-align:left;font-weight:600;width:44px}
  input.n{width:100%;max-width:74px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 4px;text-align:center;font:600 16px Inter}
  input.n:focus{outline:none;border-color:var(--acc-txt)}
  input.n::placeholder{color:#59606b;font-weight:500}
  .chk{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:18px;cursor:pointer}
  .chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chk.busy{opacity:.5}
  tr.prev td{padding-top:0;font-size:11.5px;color:var(--mut);text-align:left}
  tr.done input.n{border-color:#0f5f61}
  tr.shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  textarea,.txt{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:15px Inter}
  textarea{min-height:80px;resize:vertical}
  .txt.code{text-transform:uppercase;text-align:center;font:700 22px Inter;letter-spacing:.15em;padding:14px}
  label.lb{display:block;font-weight:600;margin:14px 0 6px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 16px Inter;background:var(--acc);color:var(--acc-ink);cursor:pointer;margin-top:14px}
  .btn.ghost{background:var(--card2);color:var(--txt)}
  .btn:disabled{opacity:.6}
  .link{background:none;border:0;color:var(--mut);font:13px Inter;text-decoration:underline;cursor:pointer;margin:24px auto 0;display:block}
  .doms-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .doms-row:last-child{border-bottom:0}
  .doms-row span{flex:0 0 120px;font-size:14px;text-transform:capitalize}
  .doms-row input[type=range]{flex:1;accent-color:var(--acc)}
  .dm-leg{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .dm-leg summary{cursor:pointer;padding:11px 14px;font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.02em;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .dm-leg summary::-webkit-details-marker{display:none}
  .dm-leg summary i{font-style:italic;font-weight:600;color:var(--mut);font-size:14px}
  .dm-leg[open] summary .dm-chev{transform:rotate(180deg)}
  .dm-l{display:flex;gap:0;border-top:1px solid var(--line)}
  .dm-l b{flex:0 0 38px;display:flex;align-items:center;justify-content:center;font:700 20px "Barlow Condensed",sans-serif;background:var(--c);color:var(--k)}
  .dm-l span{padding:9px 12px;font-size:13.5px;line-height:1.4}
  .dm-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .dm-row:last-child{border-bottom:0}
  .dm-top{display:flex;align-items:center;gap:10px}
  .dm-name{flex:1;min-width:0;font-weight:600;font-size:14.5px;text-transform:capitalize}
  .dm-btns{display:flex;gap:6px}
  .dm-b{width:38px;height:38px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--txt);font:700 17px "Barlow Condensed",sans-serif;cursor:pointer;padding:0;transition:transform .12s}
  .dm-b.on{background:var(--c);border-color:var(--c);color:var(--k);transform:scale(1.08)}
  .dm-txt{font-size:12.5px;line-height:1.4;margin-top:7px;padding-left:10px;border-left:3px solid var(--c);color:var(--txt)}
  .dm-txt:empty{display:none}
  .dm-row.falta .dm-name{color:#ff6b6b}
  .doms-row b{width:22px;text-align:right;font-family:"Barlow Condensed";font-size:20px;color:var(--acc-txt)}
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:#1f292d;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px #0008;z-index:10}
  .timer.show{display:flex}
  .timer .t{font-family:"Barlow Condensed";font-size:30px;font-weight:700;min-width:70px}
  .timer.end .t{color:var(--acc-txt)}
  .timer button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;padding:7px 10px;font:600 13px Inter;cursor:pointer}
  .timer .grow{flex:1;font-size:12px;color:var(--mut)}
  .toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
  .toast.err{background:var(--err);color:#2a0606}
  .toast.show{opacity:1}
  .sync{font-size:11.5px;color:var(--mut)} .sync.err{color:var(--err)} .sync.pend{color:var(--warn)}
  .center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc-txt);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .install{background:#0a2628;border:1px solid #11484a;border-radius:14px;padding:12px 14px;margin:14px 0 4px;display:flex;flex-direction:column;gap:8px;color:#d6f1f1;font-size:14px;line-height:1.4}
  .install b{color:#fff}
  .install .row{display:flex;gap:8px;flex-wrap:wrap}
  .install button{border:0;border-radius:10px;padding:9px 14px;font:600 14px Inter;cursor:pointer;background:var(--acc);color:#fff}
  .install button.sec{background:transparent;color:#a9e2e3;border:1px solid #11484a}
  .wa{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 13px Inter;color:#a9e2e3;border:1px solid #11484a;border-radius:999px;padding:6px 12px;background:#0a2628}
  .wa svg{flex:0 0 auto}
  .wa.big{display:flex;justify-content:center;width:100%;box-sizing:border-box;padding:13px;border-radius:14px;font-size:15px;margin-top:14px}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px}
  .seg button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:10px 6px;font:600 14px Inter;cursor:pointer}
  .seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid3 input{width:100%;box-sizing:border-box}
  select.txt{appearance:none;-webkit-appearance:none}
  .kcal{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:58px;line-height:1;color:#fff}
  .kcal small{font-size:22px;color:var(--acc-txt);margin-left:6px}
  .macro{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
  .macro:last-child{border-bottom:0}
  .macro .top{display:flex;justify-content:space-between;font-weight:600}
  .macro .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
  .macro .bar i{display:block;height:100%;border-radius:99px}
  .desglose{display:grid;gap:6px;font-size:14px;color:var(--mut)}
  .desglose div{display:flex;justify-content:space-between}
  .desglose b{color:var(--txt)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#121a1d;border-top:1px solid #2b3a41;box-shadow:0 -8px 24px rgba(0,0,0,.35);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .tabbar[hidden]{display:none}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;color:#7f8b91;font:600 11.5px Inter;text-decoration:none;cursor:pointer;border-radius:12px;max-width:140px;margin:0 auto;width:100%;transition:color .15s}
  .tab svg{width:24px;height:24px}
  .tab.on{color:#fff}
  .tab.on .pill-ico{background:var(--acc);color:#fff}
  .pill-ico{display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:999px;transition:background .15s}
  .picker{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);cursor:pointer;font:inherit}
  .picker .pk-t{flex:1;min-width:0}
  .picker b{display:block;font:700 19px "Barlow Condensed",sans-serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picker small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picker svg{flex:0 0 auto;color:var(--acc-txt)}
  .vh-peso{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;color:var(--txt);cursor:pointer;margin-top:12px}
  .vh-peso svg{width:46%;height:46px} .vh-kg{font:800 italic 30px 'Barlow Condensed',sans-serif;margin:2px 0}
  .vd-g{display:grid;grid-template-columns:1fr 1fr;gap:10px} .vd-g label,.vd-l{display:block;font-size:12.5px;color:var(--mut)} .vd-l{margin-top:10px}
  .vd-g .txt,.vd-l .txt{margin-top:4px;width:100%;box-sizing:border-box}
  .vd-res{margin-top:12px;padding:10px 12px;border-radius:12px;background:#0a2628;color:#a9e2e3;font-size:14px}
  .vd-n button{flex:1} .vd-com{padding:10px 0;border-top:1px solid var(--line)} .vd-com:first-of-type{border-top:0}
  .vd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .vd-chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:6px 10px;font:600 13px Inter;cursor:pointer}
  .vd-chip span{color:var(--mut);margin-left:2px} .vd-add{border:1px dashed var(--acc);background:transparent;color:var(--acc-txt);border-radius:999px;padding:6px 12px;font:600 13px Inter;cursor:pointer}
  .vd-aviso{margin-top:8px;font-size:13px;color:#f4c24d;line-height:1.45}
  body.vipsr .cta-checkin[data-go="checkin"], body.vipsr [data-go="checkin"]{display:none!important}
  .sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
  .sheet-bg[hidden]{display:none}
  .sheet{width:min(520px,100%);max-height:78vh;display:flex;flex-direction:column;background:#11181b;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));animation:sube .22s ease}
  .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
  .sheet h3{font-size:22px;font-style:italic;font-weight:800;margin:0 4px 10px}
  .sheet-list{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  .sheet-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:12px;background:none;color:var(--txt);padding:11px 10px;cursor:pointer;font:inherit}
  .sheet-it:active,.sheet-it:hover{background:var(--card2)}
  .sheet-it.on{background:#0a2628;box-shadow:inset 0 0 0 1px #11484a}
  .sheet-it .it-t{flex:1;min-width:0}
  .sheet-it b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:600 15px Inter;line-height:1.3;overflow:hidden}
  .sheet-it small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .sheet-it .it-v{text-align:right;flex:0 0 auto}
  .sheet-it .it-v strong{display:block;font:700 18px "Barlow Condensed",sans-serif}
  .sheet-it .it-v i{font-style:normal;font-size:11.5px;color:var(--mut)}
  .sheet-it .it-v i.up{color:var(--acc-txt)}
  @keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .chart{width:100%;height:auto;display:block;margin-top:6px}
  .free{display:block;font-size:12.5px;color:#a9e2e3;background:#0a2628;border:1px solid #11484a;border-radius:12px;padding:9px 12px;margin:10px 0}
  .free b{color:#fff}
  .lock{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
  .lock h3{display:flex;align-items:center;gap:8px;font:700 19px "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0 0 4px}
  .lock h3 svg{color:#f4c24d;flex:0 0 auto}
  .lock p{color:var(--mut);font-size:13.5px;line-height:1.5;margin:0}
  .lock-prev{position:relative;margin-top:10px}
  .lock .blur{filter:blur(4px);opacity:.5;pointer-events:none;user-select:none}
  .sello{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(11,16,18,.88);border:1px solid #6b5200;color:#ffe08a;font:600 13px Inter;padding:7px 13px;border-radius:999px}
  .sello svg{width:15px;height:15px}
  .lock-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:var(--acc);color:#fff;font:700 15px Inter;text-decoration:none}
  .ses{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;color:var(--txt);cursor:pointer;font:inherit}
  .ses .d{flex:0 0 46px;text-align:center;background:#0a2628;border-radius:10px;padding:6px 0;color:var(--acc-txt);font:700 20px "Barlow Condensed",sans-serif;line-height:1}
  .ses .d small{display:block;font:600 10.5px Inter;color:#a9e2e3;margin-top:2px;text-transform:uppercase}
  .ses .t{flex:1;min-width:0}
  .ses b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ses .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
  .iex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
  .iex-top{display:flex;gap:8px;align-items:center}
  .iex-top input{flex:1;font-weight:600}
  .iset{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}
  .iset span{color:var(--mut);font:700 16px "Barlow Condensed",sans-serif;text-align:center}
  .iset input{text-align:center}
  .ix{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:16px;cursor:pointer;padding:0}
  .ihead{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;margin-top:10px;color:var(--mut);font-size:12px;text-align:center}
  .iadd{border:1px dashed #2b3a41;background:none;color:var(--acc-txt);border-radius:10px;padding:9px 12px;font:600 13.5px Inter;cursor:pointer;margin-top:10px}
  .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 0}
  .wk-d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);font:700 15px "Barlow Condensed",sans-serif}
  .wk-d i{font-style:normal;font-size:12px;height:14px;line-height:14px}
  .wk-d.con{color:var(--txt)} .wk-d.con i{color:var(--acc-txt)}
  .wk-d.ok{background:#173322;border-color:#1f4a30;color:#5fd38d} .wk-d.ok i{color:#5fd38d}
  .wk-d.hoy{box-shadow:inset 0 0 0 2px var(--acc-txt)}
  .wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 4px}

const store = { get(){ try { return localStorage.getItem(KEY) || ""; } catch(e){ return ""; } },
                set(v){ try { localStorage.setItem(KEY, v); } catch(e){} },
                del(){ try { localStorage.removeItem(KEY); } catch(e){} } };
function netErr(msg){ const e = new Error(msg || "Sin conexión"); e.red = true; return e; }
function api(fn){ const args = [].slice.call(arguments,1);
  return fetch(API_URL, { method: "POST", body: JSON.stringify(LECTURA() ? { fn: fn, args: args, coach: COACH } : { fn: fn, args: args }) })
    .catch(() => { throw netErr(); })
    .then(r => { if (!r.ok) throw netErr("Sin conexión con el servidor"); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(amable(j.error)); return j.data; }); }
// Los errores técnicos de Google se cambian por un mensaje entendible
function amable(m){ m = String(m || ""); return !m || /https?:|Exception|permiso para llamar|TypeError|undefined|null|Cannot|Service|Servicio|excedido|exceeded|timed? ?out|tiempo de espera/i.test(m) ? "Algo ha fallado. Inténtalo otra vez en un momento; si sigue pasando, avisa a Aitor." : m; }

/* ========== Cola sin conexión ==========
   Si no hay cobertura, lo que apunta el cliente se guarda en el móvil
   y se envía solo, en el mismo orden, cuando vuelve la conexión. */
const QKEY = "entrenaitor_cola", CKEY = "entrenaitor_cache";
function cola(){ try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch(e){ return []; } }
function setCola(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} }
let vaciando = false;
function vaciarCola(){
  if (vaciando) return Promise.resolve();
  const q = cola(); if (!q.length) { syncUI(); return Promise.resolve(); }
  vaciando = true; syncUI();
  const it = q[0];
  return api(it.fn, it.code, ...it.args).then(() => {
    setCola(cola().slice(1)); vaciando = false; return vaciarCola();
  }).catch(e => {
    vaciando = false;
    if (!e.red) { setCola(cola().slice(1)); toast("Un dato no se pudo guardar: " + e.message, true); return vaciarCola(); }
    syncUI();
  });
}
window.addEventListener("online", () => vaciarCola());
setInterval(() => { if (cola().length) vaciarCola(); }, 30000);

let CODE = (CODIGO_URL || store.get() || "").toUpperCase();
let D = null;          // datos de la semana actual
let pend = 0;          // guardados en curso
const app = document.getElementById("app");
const esc = t => String(t==null?"":t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

function encolar(fn, args){ const q = cola(); q.push({ fn: fn, code: CODE, args: args, t: Date.now() }); setCola(q); guardarCache(); syncUI(); }
function guardar(fn, ...args){
  if (LECTURA()) { toast("Modo entrenador: solo lectura", true); return Promise.reject(new Error("Solo lectura")); }
  if (cola().length) { encolar(fn, args); vaciarCola(); return Promise.resolve(true); }
  pend++; syncUI();
  return api(fn, CODE, ...args).then(r=>{ pend--; syncUI(); guardarCache(); return r; })
    .catch(e=>{ pend--;
      if (e.red) { encolar(fn, args); toast("Sin cobertura: lo guardo en el móvil y lo envío al volver la conexión"); return true; }
      syncUI(true); toast(e.message || "No se ha podido guardar", true); throw e; });
}
function syncUI(err){
  const el = document.getElementById("sync"); if (!el) return;
  const n = cola().length;
  el.className = "sync" + (err ? " err" : n ? " pend" : "");
  el.textContent = err ? "Error al guardar" : n ? `Pendiente de enviar (${n})` : pend ? "Guardando…" : "Guardado ✓";
}
/* Copia de la última rutina cargada, para abrir la app sin cobertura */
function guardarCache(){ if (!D) return; try { const c = JSON.parse(localStorage.getItem(CKEY)) || {}; c[CODE + "|" + D.semana] = D; c[CODE + "|ultima"] = D.semana; localStorage.setItem(CKEY, JSON.stringify(c)); } catch(e){} }
function leerCache(semana){ try { const c = JSON.parse(localStorage.getItem(CKEY)) || {}; const w = semana || c[CODE + "|ultima"]; return w ? c[CODE + "|" + w] || null : null; } catch(e){ return null; } }
/* Lo pendiente de enviar se superpone a lo que llega de la hoja, para que no "desaparezca" */
function aplicarCola(d){
  cola().filter(it => it.code === CODE && it.args[0] === d.semana).forEach(it => {
    const dia = d.dias.find(x => x.n === it.args[1]); if (!dia) return;
    if (it.fn === "guardarSerie") { const [ , , idx, j, reps, kg, rir] = it.args; const e = dia.ej.find(x => x.idx === idx); if (e) e.sets[j] = { reps, kg, rir }; }
    if (it.fn === "guardarCampo") dia[it.args[2]] = it.args[3];
    if (it.fn === "guardarAgujetas") Object.assign(dia.doms, it.args[2]);
  });
  return d;
}

function cargar(semana){
  // Si hay una copia guardada en el móvil, se enseña al instante y se actualiza por detrás (Google tarda unos segundos)
  const copia = !COACH && !semana ? leerCache(null) : null;
  let mostrada = false;
  if (copia && !D) { D = aplicarCola(copia); mostrada = true; route(); actualizandoUI(true); }
  else app.innerHTML = `<div class="center"><div class="spin"></div><p class="mut small" style="text-align:center;margin-top:14px">Cargando tu rutina…</p></div>`;
  return api("cargar", CODE, semana || null).then(d=>{
      actualizandoUI(false);
      if (d && d.coach) { COACH = CODE; store.set(CODE); D = null; viewCoach(); return; }
      if (d && d.invitado) { D = null; viewInvAlta(); return; }
      D = LECTURA() ? d : aplicarCola(d); if (!COACH) store.set(CODE);
      guardarCache(); if (!BASC) BASC = leerBasc();
      const escribiendo = mostrada && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (!escribiendo) { const y = window.scrollY; route(); if (mostrada) window.scrollTo(0, y); }
      vaciarCola();
      const fotoInicio = () => ctaCheckin() + (D && D.nutricion && !D.sinRutina ? pesoMiniHTML(true) : ""), antes = fotoInicio();
      refrescarBasc().then(() => { const enInicio = !location.hash.replace("#","") || location.hash === "#inicio"; if (enInicio && !D.sinRutina && fotoInicio() !== antes) { const y = window.scrollY; viewHome(); window.scrollTo(0, y); } }).catch(()=>{}); })
    .catch(e=>{
      actualizandoUI(false);
      if (mostrada) { if (e.red) toast("Sin conexión: te enseño la última versión guardada"); else if (/no válido|no está activo/i.test(e.message || "")) { D = null; viewLogin(e.message); } return; }
      const c = e.red ? leerCache(semana) : null;
      if (c) { D = aplicarCola(c); route(); toast("Sin conexión: te enseño la última versión guardada"); return; }
      if (/no tiene semanas/i.test((e && e.message) || "")) { viewPreparando(); return; }
      viewLogin(e && e.message ? (e.red ? "No hay conexión y aún no hay una rutina guardada en este móvil." : e.message) : "No se ha podido conectar"); });
}

/* ========== Mi dieta (clientes con Nutrición: Sí) ==========
   Lee el "Plan de alimentación" de su copia y la base de datos de Aitor. Al tocar un alimento
   ofrece cambios del mismo subgrupo: los gramos se cuadran a su macro principal y después se
   reajustan solos la grasa y el cereal de esa comida para que quede con los mismos macros.
   Los cambios solo se guardan en el móvil del cliente: el Sheets de Aitor no se toca. */
const DKEY = "entrenaitor_dieta", DSEL = "entrenaitor_dieta_sel";
const ICO_SG = { "Proteína magra": "🍗", "Proteína grasa": "🥩", "Lácteo": "🥛", "Leche": "🥛", "Cereal": "🍚", "Fruta": "🍎", "Verdura": "🥦", "Grasa": "🥑" };
const ICO_NOM = [[/huevo|clara/i, "🥚"], [/merluza|at[uú]n|salm[oó]n|sardina|melva|bacalao|pescado|gamba/i, "🐟"], [/pollo|pavo/i, "🍗"],
  [/jam[oó]n|lomo|embuchado|carne|ternera|cerdo|vacuno/i, "🥩"], [/queso|mozzarella|havarti|cheddar/i, "🧀"], [/leche|natilla|yogur|batido|mousse/i, "🥛"],
  [/evolate|evohydro|prote[ií]na en polvo|whey|iso/i, "🥤"], [/pan |pan$|molde|brioche|tortilla|picos/i, "🍞"], [/pasta|macarr|espagu/i, "🍝"],
  [/arroz/i, "🍚"], [/avena|muesli|corn|cereal|chocozero/i, "🥣"], [/patata|boniato/i, "🥔"], [/pl[aá]tano/i, "🍌"], [/manzana/i, "🍎"],
  [/aceite/i, "🫒"], [/chocolate/i, "🍫"], [/cacahuete|nuez|nueces|pistacho|almendra/i, "🥜"], [/tomate/i, "🍅"], [/pimiento/i, "🫑"]];
const icoAlim = (n, f) => { const m = ICO_NOM.find(([r]) => r.test(n)); return m ? m[1] : (f && ICO_SG[f.sg]) || "🍽️"; };
// Comida que toca según la hora (reparte las comidas entre las 7:00 y las 22:00)
function comidaAhora(n){ const h = new Date().getHours() + new Date().getMinutes() / 60; return Math.max(0, Math.min(n - 1, Math.floor((h - 7) / (15 / n)))); }
const MAIN = { "Proteína magra": "p", "Proteína grasa": "p", "Lácteo": "p", "Cereal": "h", "Fruta": "h", "Grasa": "g", "Leche": "k" };
let DIE = null, DIE_ERR = "", DIE_CAMBIO = null, DIE_CODE = "";
const normN = s => String(s || "").trim().toLowerCase();
function dieLeer(){ try { return (JSON.parse(localStorage.getItem(DKEY)) || {})[CODE] || null; } catch(e){ return null; } }
function dieGuardar(d){ try { const c = JSON.parse(localStorage.getItem(DKEY)) || {}; c[CODE] = d; localStorage.setItem(DKEY, JSON.stringify(c)); } catch(e){} }
function dieMapa(d){ if (d && d.bd && !d.mapa) { d.mapa = {}; d.bd.forEach(f => d.mapa[normN(f.n)] = f); } return d; }
const bdF = n => DIE && DIE.mapa && DIE.mapa[normN(n)];
function firmaDieta(d){ return JSON.stringify((d.comidas || []).map(c => c.op.map(o => o.items.map(i => i.n + i.g)))); }
function selTodo(){ try { return JSON.parse(localStorage.getItem(DSEL)) || {}; } catch(e){ return {}; } }
function selLeer(){ const s = selTodo()[CODE]; return s && DIE && s.firma === firmaDieta(DIE) ? s : { firma: DIE ? firmaDieta(DIE) : "", op: {}, items: {} }; }
function selGuardar(s){ try { const t = selTodo(); t[CODE] = s; localStorage.setItem(DSEL, JSON.stringify(t)); } catch(e){} }
function macrosDe(items){ return items.reduce((t, it) => { const f = bdF(it.n); if (f) { t.k += f.k * it.g / 100; t.g += f.g * it.g / 100; t.p += f.p * it.g / 100; t.h += f.h * it.g / 100; } return t; }, { k: 0, g: 0, p: 0, h: 0 }); }
function redondea(f, g){ if (f.ud) return Math.max(0.5, Math.round(g / f.ud * 2) / 2) * f.ud; return g < 25 ? Math.round(g) : Math.round(g / 5) * 5; }
const n0 = x => Math.round(x).toLocaleString("es-ES");
function cantTxt(n, g){ const f = bdF(n);
  if (f && f.ud) { const u = g / f.ud, us = (Math.round(u * 2) / 2).toLocaleString("es-ES"); return `${us} ${u === 1 ? "ud." : "uds."} <small>(${n0(g)} g)</small>`; }
  return `${n0(g)} g`; }
function nomPartes(n){ const i = n.lastIndexOf(" - "); return i > 0 ? [n.slice(0, i), n.slice(i + 3)] : [n, ""]; }
// Reajusta grasa (subgrupo Grasa) y cereal/fruta de la comida para volver a los macros originales
function reajustar(items, idx, orig, cambiado){
  const t = macrosDe(items), libre = (i, sg) => i !== idx && !cambiado[i] && bdF(items[i].n) && sg.indexOf(bdF(items[i].n).sg) >= 0 && !bdF(items[i].n).ud;
  const iG = items.findIndex((x, i) => libre(i, ["Grasa"])), iC = items.findIndex((x, i) => libre(i, ["Cereal", "Fruta"]));
  const dG = orig.g - t.g, dH = orig.h - t.h; let a = 0, b = 0;
  const F = iG >= 0 ? bdF(items[iG].n) : null, C = iC >= 0 ? bdF(items[iC].n) : null;
  if (F && C) { const fg = F.g / 100, fh = F.h / 100, cg = C.g / 100, ch = C.h / 100, det = fg * ch - cg * fh;
    if (Math.abs(det) > 1e-6) { a = (dG * ch - cg * dH) / det; b = (fg * dH - dG * fh) / det; } }
  else if (F && F.g) a = dG / (F.g / 100);
  else if (C && C.h) b = dH / (C.h / 100);
  const out = items.map(x => ({ n: x.n, g: x.g })), cambios = [];
  [[iG, a, 1], [iC, b, 5]].forEach(([i, d, paso]) => { if (i < 0 || !d) return;
    const de = out[i].g, max = de * 1.6; let g = Math.min(max, Math.max(0, de + d)); g = paso === 1 ? Math.round(g) : Math.round(g / 5) * 5;
    if (Math.abs(g - de) >= 1) { out[i].g = g; cambios.push({ n: out[i].n, de: de, a: g }); } });
  return { items: out.filter(x => x.g > 0), cambios: cambios };
}
function opcionesCambio(items, idx, original){
  const it = items[idx], f = bdF(it.n); if (!f || !f.ok || !MAIN[f.sg]) return [];
  const m = MAIN[f.sg], orig = macrosDe(original), out = [];
  const cambiado = {}; items.forEach((x, i) => { if (i !== idx && original[i] && normN(original[i].n) !== normN(x.n)) cambiado[i] = 1; });
  DIE.bd.forEach(c => {
    if (c.sg !== f.sg || !c.ok || normN(c.n) === normN(f.n)) return;
    const per = c[m], base = f[m] * it.g; if (!per || !base) return;
    const g2 = redondea(c, base / per);
    const prov = items.map((x, i) => i === idx ? { n: c.n, g: g2 } : { n: x.n, g: x.g });
    const aj = reajustar(prov, idx, orig, cambiado), t = macrosDe(aj.items);

/* ========== Progreso (RM estimado) ==========
   Lee la pestaña "Datos de rendimiento" de la hoja del cliente, que Aitor
   actualiza con el botón del Sheets. Mismos números que sus gráficas. */
const PKEY = "entrenaitor_progreso";
let PROG = null, PROG_SEL = "", PROG_ERR = "", PROG_LISTA = [];
function leerProg(){ try { return (JSON.parse(localStorage.getItem(PKEY)) || {})[CODE] || null; } catch(e){ return null; } }
function guardarProg(p){ try { const c = JSON.parse(localStorage.getItem(PKEY)) || {}; c[CODE] = p; localStorage.setItem(PKEY, JSON.stringify(c)); } catch(e){} }
const ejCorto = t => String(t).split(" - ")[0].trim();
const kg1 = v => (Math.round(v * 10) / 10).toLocaleString("es-ES");
function viewProgreso(){
  if (!PROG) PROG = leerProg();
  pintarProgreso();
  api("progreso", CODE).then(p => { PROG = p || []; PROG_ERR = ""; guardarProg(PROG); if (location.hash === "#progreso") pintarProgreso(); })
    .catch(e => { PROG_ERR = e.red ? "Sin conexión: mostrando los últimos datos guardados." : e.message; if (location.hash === "#progreso") pintarProgreso(); });
}
function graficaRM(p, lab, ajustado){
  lab = lab || (x => "S" + x[0]);
  const W = 340, H = 190, L = 34, R = 14, T = 22, B = 26;
  const vals = p.map(x => x[1]), mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  const pad = ajustado ? Math.max((mx - mn) * 0.25, Math.abs(mx) * 0.015, 0.5) : 2;
  const lo = Math.max(0, mn - (ajustado ? pad : (mx - mn) * 0.25 + pad)), hi = mx + (ajustado ? pad : (mx - mn) * 0.12 + pad);
  const X = i => p.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (p.length - 1);
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const iMax = vals.indexOf(mx), cada = p.length > 10 ? 2 : 1;
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="RM estimado por semana">`;
  [lo, (lo + hi) / 2, hi].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${ajustado && hi - lo < 6 ? kg1(v) : Math.round(v)}</text>`; });
  if (p.length > 1) g += `<polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${p.map((x, i) => X(i) + "," + Y(x[1])).join(" ")}"/>`;
  p.forEach((x, i) => {
    const best = i === iMax, last = i === p.length - 1;
    g += `<circle cx="${X(i)}" cy="${Y(x[1])}" r="${best ? 6 : 4}" fill="${best ? "#ffffff" : "var(--acc-txt)"}"/>`;
    if (best || last || i === 0) g += `<text x="${X(i)}" y="${Y(x[1]) - 10}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--txt)">${kg1(x[1])}</text>`;
    if (i % cada === 0 || last) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(lab(x))}</text>`;
  });
  return g + `</svg>`;
}
const ejMusc = t => { const i = String(t).indexOf(" - "); return i < 0 ? "" : String(t).slice(i + 3).trim(); };
function pctEj(p){ return p.length > 1 && p[0][1] > 0 ? Math.round((p[p.length - 1][1] - p[0][1]) / p[0][1] * 100) : null; }
const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function abrirSheet(abrir){ const el = document.getElementById("prSheet"); if (!el) return; el.hidden = !abrir; document.body.style.overflow = abrir ? "hidden" : "";

function pintarProgreso(){

const hoyISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

// Reduce la foto en el móvil (lado largo 1000 px, ~200 KB) antes de subirla
function reducirFoto(file){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.82, d = c.toDataURL("image/jpeg", q);
      while (d.length * 0.75 > 200 * 1024 && q > 0.4) { q -= 0.08; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No se ha podido leer la foto")); };
    img.src = url;
  });
}

    guardar("guardarSerie", D.semana, n, e.idx, j, reps, kg, rir);
    if (!yaHecho) startTimer(120);
    return; }
  if (t.id === "fin" && d){
    const tiempo = document.getElementById("tiempo").value, notas = document.getElementById("notas").value;
    if (String(d.rpe).trim()===""){ toast("Marca el esfuerzo percibido (1-10)"); return; }
    d.tiempo = tiempo; d.notas = notas; t.disabled = true;
    Promise.all([guardar("guardarCampo", D.semana, n, "tiempo", tiempo), guardar("guardarCampo", D.semana, n, "notas", notas)])
      .then(()=>{ toast("Sesión guardada"); viewDay(n); }).catch(()=>{ t.disabled = false; });
    return; }
  if (t.id === "saveDoms"){
    const m = location.hash.match(/agujetas-(\d+)/), dd = dia(+m[1]), o = {};
    const faltan = Object.keys(dd.doms||{}).filter(k => !DOMS_SEL[k]);
    if (faltan.length) {
      app.querySelectorAll(".dm-row").forEach(r => r.classList.toggle("falta", faltan.includes(r.dataset.row)));
      const f = app.querySelector(".dm-row.falta"); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" });
      toast(faltan.length === 1 ? "Te falta 1 grupo por puntuar" : `Te faltan ${faltan.length} grupos por puntuar`, true); return; }
    Object.keys(dd.doms||{}).forEach(k => o[k] = DOMS_SEL[k]);
    t.disabled = true;
    guardar("guardarAgujetas", D.semana, dd.n, o).then(()=>{ Object.assign(dd.doms, o); toast("Agujetas guardadas"); go("inicio"); })
      .catch(()=>{ t.disabled = false; });
  }
});
function viewDayKeep(n){ const y = window.scrollY; viewDay(n); window.scrollTo(0,y); }

app.addEventListener("keydown", ev=>{ if (ev.key === "Escape") abrirSheet(false); if (ev.key==="Enter" && ev.target.id==="cod") document.getElementById("entrar").click(); });
app.addEventListener("input", ev=>{
  if (SB && ev.target.dataset.sbn != null) { SB.dias[+ev.target.dataset.sbn].nombre = ev.target.value; return; }
  if (SB && ev.target.dataset.sbe) { const [i, j] = ev.target.dataset.sbe.split(",").map(Number); SB.dias[i].ejercicios[j].nombre = ev.target.value; return; }
  if (IB && ev.target.dataset.ibn != null) { IB.ejercicios[+ev.target.dataset.ibn].nombre = ev.target.value; guardarBorrador(IB); return; }
  if (IB && ev.target.dataset.ibs) { const [i, j, c] = ev.target.dataset.ibs.split(","); IB.ejercicios[+i].series[+j][c] = ev.target.value; guardarBorrador(IB); return; }
  if (IB && IB.comoDia && ev.target.id === "ib-dnom") { IB.comoDia.nombre = ev.target.value; guardarBorrador(IB); return; }
  if (IB && ev.target.id === "ib-fecha") { IB.fecha = ev.target.value; guardarBorrador(IB); return; }
  if (ev.target.type==="range") ev.target.nextElementSibling.textContent = ev.target.value;
  if (ev.target.dataset.n){ const d = nutriDatos(); d[ev.target.dataset.n] = ev.target.dataset.n === "act" ? +ev.target.value : ev.target.value.trim(); nutriGuardar(d); nutriActualizar(); } });
// Si cambia una serie ya marcada, se vuelve a guardar al salir del campo
app.addEventListener("change", ev=>{
  const el = ev.target, n = diaActual(), d = n && dia(n); if (!d) return;
  if (el.dataset.f){
    const [i,j] = el.dataset.k.split("-").map(Number), e = d.ej[i];
    if (!hecho(e.sets[j])) return;
    const row = document.getElementById("r"+el.dataset.k), get = f => row.querySelector(`[data-f="${f}"]`).value.trim();
    e.sets[j] = {reps:get("reps"), kg:get("kg"), rir:get("rir")};
    guardar("guardarSerie", D.semana, n, e.idx, j, e.sets[j].reps, e.sets[j].kg, e.sets[j].rir);
  }
  if ((el.id==="notas" || el.id==="tiempo") && String(d.rpe).trim()!==""){ d[el.id] = el.value; guardar("guardarCampo", D.semana, n, el.id, el.value); }
});

/* Temporizador de descanso */
let tLeft = 0, tInt = null; const T = document.getElementById("timer"), TV = document.getElementById("tval");
function fmt(s){ const a=Math.max(0,s); return Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); }
function startTimer(sec){ tLeft = sec; T.classList.add("show"); T.classList.remove("end"); TV.textContent = fmt(tLeft);
  clearInterval(tInt); tInt = setInterval(()=>{ tLeft--; TV.textContent = tLeft>0?fmt(tLeft):"¡Ya!"; if (tLeft<=0){ T.classList.add("end"); clearInterval(tInt);} },1000); }
T.addEventListener("click", ev=>{ const b = ev.target.closest("button"); if(!b) return;
  if (b.dataset.t==="x"){ clearInterval(tInt); T.classList.remove("show"); return; }
  tLeft = Math.max(0, tLeft + (+b.dataset.t)); if (tLeft>0 && T.classList.contains("end")) startTimer(tLeft); TV.textContent = fmt(tLeft); });

let toT; function toast(m, err){ const el=document.getElementById("toast"); el.textContent=m; el.className="toast show"+(err?" err":""); clearTimeout(toT); toT=setTimeout(()=>el.classList.remove("show"),2200); }

window.addEventListener("hashchange", route);
{ const g = leerInv();
  if (g && (!CODIGO_URL || String(CODIGO_URL).toUpperCase() === g.codigo)) entrarInvitado(g);
  else if (CODE) cargar(); else viewLogin(); }
/* Actualización automática: si hay versión nueva, la app se recarga sola
   (salvo si el cliente está apuntando series o agujetas; entonces espera a que salga de esa pantalla). */
if ("serviceWorker" in navigator) {
  let habiaSW = !!navigator.serviceWorker.controller, pendiente = false;
  const ocupado = () => /^#(dia|agujetas)-/.test(location.hash);
  const recargar = () => { if (ocupado()) { pendiente = true; return; } location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (habiaSW) recargar(); habiaSW = true; });
  window.addEventListener("hashchange", () => { if (pendiente && !ocupado()) location.reload(); });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Al volver a la app (desde otra app o la pantalla de inicio), mirar si hay versión nueva
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
